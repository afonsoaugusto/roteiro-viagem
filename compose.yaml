services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: npm run dev

volumes:
  app_node_modules:
